name: 📊 Estadísticas Semanales — Viernes 5pm

on:
  schedule:
    # Viernes 5:18 PM Chile (UTC-4) = 9:18 PM UTC = 21:18 UTC (minuto impar para evitar demoras)
    # Force schedule sync: 2026-05-28
    - cron: '18 17 * * 5'
  workflow_dispatch:

jobs:
  send-weekly-stats:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Generar reporte estadístico de la semana
        run: |
          python3 << 'PYEOF'
          import json, datetime, math

          try:
              with open('tasks.json', 'r', encoding='utf-8') as f:
                  tasks = json.load(f)
          except:
              tasks = []

          TZ_OFFSET = -4
          now_utc = datetime.datetime.utcnow()
          now_local = now_utc + datetime.timedelta(hours=TZ_OFFSET)
          today = now_local.date()
          monday = today - datetime.timedelta(days=today.weekday())
          friday = today

          MONTHS_ES = ['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']
          CAT_COLORS = {
              'Docencia':       ('#EFF6FF', '#2563EB', '#1D4ED8', '#DBEAFE'),
              'Investigación':  ('#F5F3FF', '#7C3AED', '#6D28D9', '#EDE9FE'),
              'Administración': ('#FFFBEB', '#B45309', '#92400E', '#FEF3C7'),
              'Personal':       ('#ECFDF5', '#047857', '#065F46', '#D1FAE5'),
          }
          PRIO_ORDER = {'high': 0, 'medium': 1, 'low': 2}
          PRIO_LABELS = {'high':'🔴 Alta','medium':'🟡 Media','low':'🟢 Baja'}
          STATUS_LABELS = {'done':'Completada','progress':'En Progreso','pending':'Pendiente','cancelled':'❌ Cancelada','no_asisto':'🚫 No asistido'}

          def fmt_date(iso):
              if not iso: return '—'
              y,m,d = iso.split('-')
              return f"{d}/{m}/{y}"

          def is_overdue(t):
              if t.get('status') in ('done', 'cancelled', 'no_asisto'): return False
              check = t.get('deadline') or t.get('date', '')
              return check and check < today.isoformat()

          # ── Tareas de esta semana ──────────────────────────────
          week_tasks = [t for t in tasks
                        if monday.isoformat() <= t.get('date','') <= friday.isoformat()]
          done_tasks    = [t for t in week_tasks if t.get('status') == 'done']
          pending_tasks = [t for t in week_tasks if t.get('status') not in ('done', 'cancelled', 'no_asisto')]
          overdue_tasks = [t for t in tasks if is_overdue(t)]
          
          week_active   = [t for t in week_tasks if t.get('status') not in ('cancelled', 'no_asisto')]
          total         = len(week_active)
          done_count    = len(done_tasks)
          pct           = round(done_count/total*100) if total > 0 else 0

          # ── Próximos deadlines (semana siguiente) ─────────────
          next_monday = friday + datetime.timedelta(days=3)
          next_friday = next_monday + datetime.timedelta(days=4)
          upcoming_dl = [t for t in tasks
                         if t.get('deadline','') and next_monday.isoformat() <= t.get('deadline','') <= next_friday.isoformat()
                         and t.get('status') not in ('done', 'cancelled', 'no_asisto')]
          upcoming_dl.sort(key=lambda t: (t.get('deadline',''), PRIO_ORDER.get(t.get('priority','medium'),1)))

          # Ordenar pendientes por prioridad y fecha
          pending_tasks.sort(key=lambda t: (PRIO_ORDER.get(t.get('priority','medium'),1), t.get('date','')))
          overdue_tasks.sort(key=lambda t: (t.get('date',''), PRIO_ORDER.get(t.get('priority','medium'),1)))

          # ── Tablas por categoría ──────────────────────────────
          def task_row(t, show_date=False):
              cat = t.get('cat','')
              colors = CAT_COLORS.get(cat, ('#F3F4F6', '#4B5563', '#1F2937', '#E5E7EB'))
              bg, clr, dark, light = colors
              overdue = is_overdue(t)
              
              time_str = f"<span style='color:#6B7280;font-size:12px;margin-left:8px'>🕐 {t.get('time')}</span>" if t.get('time') else ''
              date_str = f"<span style='color:#6B7280;font-size:12px;margin-left:8px'>📅 {fmt_date(t.get('date'))}</span>" if show_date else ''
              loc = f"<span style='color:#6B7280;font-size:12px;margin-left:8px'>📍 {t.get('location')}</span>" if t.get('location') else ''
              
              dl = f"<div style='color:#EF4444;font-size:11px;font-weight:600;margin-top:4px;'>⏰ Vence: {fmt_date(t.get('deadline'))}</div>" if t.get('deadline') and t.get('deadline') != t.get('date') else ''
              overdue_badge = " <span style='color:#EF4444;font-size:10px;font-weight:700;letter-spacing:0.05em;margin-left:6px;border:1px solid #FCA5A5;background:#FEF2F2;padding:1px 4px;border-radius:4px;'>VENCIDA</span>" if overdue else ''
              
              prio = t.get('priority', 'medium')
              prio_lbl = PRIO_LABELS.get(prio, '▲ Media')
              
              prio_colors = {
                  'high': ('#FEF2F2', '#EF4444', '#DC2626'),
                  'medium': ('#FFFBEB', '#F59E0B', '#D97706'),
                  'low': ('#F0FDF4', '#10B981', '#059669')
              }
              pbg, pclr, pdark = prio_colors.get(prio, ('#FFFBEB', '#F59E0B', '#D97706'))
              prio_badge = f"<span style='background:{pbg};color:{pclr};font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid {pbg};'>{prio_lbl}</span>"
              
              status_badge = STATUS_LABELS.get(t.get('status','pending'), '⏳ Pendiente')
              
              return f"""<tr>
                <td style="padding:12px;border-bottom:1px solid #E5E7EB;color:#1F2937;font-size:13px">
                  <div style="font-weight:600;color:#111827;">{t.get('title','Sin título')}{overdue_badge}</div>
                  <div style="margin-top:4px;">
                    <span style="background:{bg};color:{clr};padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700;border:1px solid {bg}">{cat}</span>
                    {time_str}{date_str}{loc}
                  </div>
                  {dl}
                </td>
                <td style="padding:12px;border-bottom:1px solid #E5E7EB;text-align:center;vertical-align:middle;">
                  {prio_badge}
                </td>
                <td style="padding:12px;border-bottom:1px solid #E5E7EB;font-size:12px;color:#4B5563;vertical-align:middle;text-align:right;">
                  <span style="font-weight:600;">{status_badge}</span>
                </td>
              </tr>"""

          def make_table(task_list, show_date=False):
              if not task_list:
                  return '<p style="color:#9CA3AF;font-size:13px;text-align:center;padding:16px;margin:0;">Sin actividades</p>'
              return f"""<table style="width:100%;border-collapse:collapse;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:8px;overflow:hidden">
                <thead><tr style="background:#F9FAFB">
                  <th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#4B5563;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid #E5E7EB">Actividad / Info</th>
                  <th style="padding:10px 12px;text-align:center;font-size:11px;font-weight:700;color:#4B5563;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid #E5E7EB">Prioridad</th>
                  <th style="padding:10px 12px;text-align:right;font-size:11px;font-weight:700;color:#4B5563;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid #E5E7EB">Estado</th>
                </tr></thead>
                <tbody>{''.join(task_row(t, show_date) for t in task_list)}</tbody>
              </table>"""

          # ── Estadísticas por categoría ─────────────────────────
          cat_blocks = ''
          for cat, colors in CAT_COLORS.items():
              bg, clr, dark, light = colors
              cat_tasks = [t for t in week_tasks if t.get('cat') == cat]
              if not cat_tasks: continue
              cat_active = [t for t in cat_tasks if t.get('status') not in ('cancelled', 'no_asisto')]
              cat_done = len([t for t in cat_active if t.get('status')=='done'])
              cat_total = len(cat_active)
              cat_pct = round(cat_done/cat_total*100) if cat_total > 0 else 0
              cat_blocks += f"""
              <div style="margin-bottom:14px">
                <table style="width:100%;border-collapse:collapse;">
                  <tr>
                    <td style="font-size:13px;font-weight:600;color:{dark};padding-bottom:4px;">{cat}</td>
                    <td style="font-size:12px;color:#6B7280;text-align:right;padding-bottom:4px;">{cat_done} de {cat_total} completadas ({cat_pct}%)</td>
                  </tr>
                  <tr>
                    <td colspan="2">
                      <div style="background-color:#E5E7EB;border-radius:99px;height:6px;overflow:hidden">
                        <div style="background-color:{clr};width:{cat_pct}%;height:100%;border-radius:99px"></div>
                      </div>
                    </td>
                  </tr>
                </table>
              </div>"""

          # ── Sección deadlines próxima semana ──────────────────
          dl_section = ''
          if upcoming_dl:
              dl_section = f"""
              <div style="background-color:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:16px;margin-bottom:24px">
                <h2 style="font-size:0.85rem;font-weight:800;color:#D97706;text-transform:uppercase;letter-spacing:0.05em;margin:0 0 12px">⏰ Deadlines Próxima Semana</h2>
                {make_table(upcoming_dl, show_date=True)}
              </div>"""

          overdue_section = ''
          if overdue_tasks:
              overdue_section = f"""
              <div style="background-color:#FFF5F5;border:1px solid #FCA5A5;border-radius:8px;padding:16px;margin-bottom:24px">
                <h2 style="font-size:0.85rem;font-weight:800;color:#EF4444;text-transform:uppercase;letter-spacing:0.05em;margin:0 0 12px">⚠️ Actividades Vencidas ({len(overdue_tasks)})</h2>
                {make_table(overdue_tasks, show_date=True)}
              </div>"""

          # ── Nota motivacional ─────────────────────────────────
          if pct == 100:
              motivation = "🏆 <strong>¡Semana perfecta!</strong> Completaste el 100% de tus actividades programadas."
          elif pct >= 80:
              motivation = f"✨ <strong>¡Excelente semana!</strong> Completaste el {pct}% de tus actividades."
          elif pct >= 60:
              motivation = f"💪 <strong>¡Buena semana!</strong> Completaste el {pct}%. Quedan {len(pending_tasks)} actividades pendientes."
          else:
              motivation = f"📋 Completaste el {pct}% esta semana. Tienes {len(pending_tasks)} actividades pendientes para la próxima."

          html = f"""<!DOCTYPE html>
          <html lang="es">
            </div>
          </div>
          </body></html>"""

          with open('email_body.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print("Reporte semanal generado")
          PYEOF

      - name: Enviar reporte estadístico
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: WeekPlanner <${{ secrets.GMAIL_USER }}>
          subject: "📊 WeekPlanner — Reporte Semanal completo"
          html_body: file://email_body.html
          attachments: tasks.json
